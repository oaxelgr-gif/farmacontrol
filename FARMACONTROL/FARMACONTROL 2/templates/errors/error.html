{% extends "layouts/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block topbar %}{% endblock %}
{% block content %}
<section class="card-glass glass reveal text-center" style="max-width:520px;margin:12vh auto 0;padding:44px 32px">
    <div class="hero-amount text-accent" style="font-size:4.5rem">{{ codigo }}</div>
    <h1 style="font-size:1.5rem;margin:10px 0 6px">{{ titulo }}</h1>
    <p class="text-2" style="margin-bottom:24px">{{ mensaje }}</p>
    <a href="{{ inicio_url }}" class="btn btn-primary"><i class="fas fa-house"></i> Ir al inicio</a>
    <button onclick="history.back()" class="btn btn-glass"><i class="fas fa-arrow-left"></i> Regresar</button>
</section>
{% endblock %}
