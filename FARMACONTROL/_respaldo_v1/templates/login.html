<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | FarmaControl</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary-blue: #0f3350; 
            --bg-gray: #f0f2f5; 
        }

        body { 
            background-color: var(--bg-gray); 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .login-card {
            background: #fff;
            border: none;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 40px;
            text-align: center;
        }

        .logo-wrapper {
            width: 170px;
            height: 170px;
            background: var(--bg-gray);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .logo-img {
            width: 150px;
            height: auto;
        }

        .login-card h3 {
            color: var(--primary-blue);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            transition: 0.3s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.2rem rgba(30, 91, 160, 0.1);
        }

        .btn-login {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            color: white;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #086e5f;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 60, 88, 0.796);
            color: white;
        }

        .alert-custom {
            border-radius: 12px;
            font-size: 0.85rem;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo-img">
            </div>

            <h3>FarmaControl</h3>
            <p>Ingresa tu <b>usuario</b> para acceder</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" name="correo" class="form-control" required placeholder="Ej: admin o juan01" autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="********">
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt mr-2"></i> Iniciar Sesión
                </button>
            </form>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-custom">
                      <i class="fas fa-exclamation-circle mr-2"></i> {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
        </div>
        
        <div class="text-center mt-4">
            <small class="text-muted">&copy; 2026 MEDICALIFE - Sistema de Gestión  </small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Forzar limpieza de sesión al cargar login
    localStorage.removeItem('session_active');
    sessionStorage.clear();
</script>
</body>
</html>
