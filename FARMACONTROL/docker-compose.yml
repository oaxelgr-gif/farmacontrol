# =====================================================================
# FarmaControl · orquestación con Docker Compose
#   db  -> farmacontrol-db  (MySQL 8 con esquema y datos iniciales)
#   api -> farmacontrol-api (FastAPI: lógica del punto de venta, /docs)
#   web -> farmacontrol-web (Flask: interfaz de la farmacia)
#
#   docker compose up -d --build      # construir y levantar
#   http://localhost:5010             # sistema
#   http://localhost:8000/docs        # API (Swagger)
# =====================================================================
name: farmacontrol

x-negocio: &negocio
  TZ: America/Mexico_City
  DIAS_ALERTA_CADUCIDAD: ${DIAS_ALERTA_CADUCIDAD:-15}

x-bd: &bd
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: medicalife
  DB_USER: ${MYSQL_APP_USER:-farmacontrol}
  DB_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacontrol_app_2026}

services:
  db:
    build: ./docker/db
    image: farmacontrol-db:2.0
    container_name: farmacontrol-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-131004131004}
      MYSQL_DATABASE: medicalife
      MYSQL_USER: ${MYSQL_APP_USER:-farmacontrol}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-farmacontrol_app_2026}
      TZ: America/Mexico_City
    ports:
      - "${DB_PORT_PUBLICO:-3307}:3306"     # 3307 para no chocar con un MySQL local
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api:
    build: ./api
    image: farmacontrol-api:2.0
    container_name: farmacontrol-api
    restart: unless-stopped
    environment:
      <<: [*bd, *negocio]
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-farmacontrol-token-interno-cambiar}
      JWT_SECRET: ${JWT_SECRET:-farmacontrol-jwt-secreto-cambiar-por-uno-largo}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5010}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: farmacontrol-web:2.0
    container_name: farmacontrol-web
    restart: unless-stopped
    environment:
      <<: [*bd, *negocio]
      SECRET_KEY: ${WEB_SECRET_KEY:-farmacontrol-flask-secreto-cambiar}
      FLASK_DEBUG: "0"
      API_URL: http://api:8000
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-farmacontrol-token-interno-cambiar}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      FONDO_SUGERIDO: ${FONDO_SUGERIDO:-500}
      NOMBRE_NEGOCIO: ${NOMBRE_NEGOCIO:-MEDICALIFE}
      NOMBRE_SUCURSAL: ${NOMBRE_SUCURSAL:-Consultorio y Farmacia}
      TELEFONO_NEGOCIO: ${TELEFONO_NEGOCIO:-(55) 1234-5678}
      ESTACION_CAJA: ${ESTACION_CAJA:-ESTACION01}
      WEB_WORKERS: ${WEB_WORKERS:-3}
      HOST_IP: ${HOST_IP:-}
      WEB_PORT_PUBLICO: ${WEB_PORT:-5010}
      API_PORT_PUBLICO: ${API_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - uploads_data:/srv/instance/uploads   # resultados de estudios (PDF/imagen)
    ports:
      - "${WEB_PORT:-5010}:5010"

volumes:
  db_data:
    name: farmacontrol_db_data
  uploads_data:
    name: farmacontrol_uploads
