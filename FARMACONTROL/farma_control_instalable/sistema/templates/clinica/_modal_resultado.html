{# Modal para capturar resultado de un estudio. Requiere CL.rellenarModal (data-modal-fill) #}
<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <form method="POST" enctype="multipart/form-data" class="modal-content" data-loading>
            <input type="hidden" name="volver" value="{{ volver_a|default('') }}">
            <div class="modal-header">
                <div><h5 class="modal-title">Resultado de estudio</h5><div class="text-muted" style="font-size:.85rem" data-text="nombre"></div></div>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-4 form-group">
                        <label>Estado</label>
                        <select name="estado" class="form-control">{% for k, v in ESTADOS_ESTUDIO.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select>
                    </div>
                    <div class="col-md-4 form-group"><label>Fecha de resultado</label><input type="date" name="fecha_resultado" class="form-control"></div>
                    <div class="col-md-4 form-group"><label>Laboratorio / gabinete</label><input type="text" name="laboratorio" class="form-control"></div>
                </div>
                <div class="form-group"><label>Resultado (valores)</label><textarea name="resultado" class="form-control" rows="4" placeholder="Ej. Glucosa 112 mg/dL, HbA1c 6.8 %…"></textarea></div>
                <div class="form-group"><label>Interpretación médica</label><textarea name="interpretacion" class="form-control" rows="2"></textarea></div>
                <div class="form-group" style="margin:0">
                    <label>Archivo del resultado (PDF o imagen, máx. 16 MB)</label>
                    <input type="file" name="archivo" class="form-control" accept=".pdf,.png,.jpg,.jpeg,.webp">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Guardar resultado</button>
            </div>
        </form>
    </div>
</div>
