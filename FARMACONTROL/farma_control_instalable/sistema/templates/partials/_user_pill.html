{% if current_user.is_authenticated %}
<button type="button" class="icon-btn no-print" data-toggle-theme title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">
    <i class="fas fa-moon" data-theme-icon></i>
</button>
<div class="user-pill glass">
    <div class="who">
        <b>{{ current_user.nombre }}</b>
        <small>{{ current_user.rol_nombre }}</small>
    </div>
    <div class="avatar">{{ current_user.iniciales }}</div>
</div>
{% endif %}
